name: payahead-phase1
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: payahead-sqlserver-dev
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${PAYAHEAD_SQL_PASSWORD:?Set PAYAHEAD_SQL_PASSWORD outside source control}
    ports:
      - "127.0.0.1:${PAYAHEAD_SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  sql-data:
